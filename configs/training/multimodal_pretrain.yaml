stage: multimodal_pretrain
data: data/manifests/multimodal_pretrain/train.jsonl
seed: 42
batch_size: 1
gradient_accumulation: 8
max_steps: 1000
max_length: 256
learning_rate: 0.00002
learning_rates:
  projector: 0.0002
  decoder: 0.00002
  vision_encoder: 0.000002
vision_unfreeze_last: 2
weight_decay: 0.01
warmup_steps: 50
max_grad_norm: 1.0
precision: bf16
gradient_checkpointing: true
save_every: 100
