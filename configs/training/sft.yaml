stage: sft
data: data/manifests/sft/train.jsonl
seed: 42
batch_size: 1
gradient_accumulation: 8
max_steps: 1000
max_length: 256
learning_rate: 0.00002
learning_rates:
  projector: 0.0001
train_embeddings: true
weight_decay: 0.01
warmup_steps: 50
max_grad_norm: 1.0
precision: bf16
gradient_checkpointing: true
task_weights:
  caption: 1
  vqa: 1
  grounding: 1
save_every: 100
