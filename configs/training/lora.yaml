stage: lora
data: data/manifests/lora/train.jsonl
seed: 42
batch_size: 1
gradient_accumulation: 8
max_steps: 1000
max_length: 256
learning_rate: 0.0001
train_embeddings: false
lora:
  rank: 8
  alpha: 16
  dropout: 0.05
  targets: [q_proj, v_proj]
weight_decay: 0.01
warmup_steps: 50
max_grad_norm: 1.0
precision: bf16
gradient_checkpointing: true
save_every: 100
