[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "simple-vlm"
version = "0.1.0"
description = "A laptop-friendly educational VLM based on nanoVLM v0.1"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["models*", "tokenization*", "datasets*", "training*", "evaluation*", "inference*", "serving*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
